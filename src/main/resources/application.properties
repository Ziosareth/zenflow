spring.application.name=${SPRING_APPLICATION_NAME:zenflow}

# Configurazione Spring Boot Docker Compose - versione corretta
spring.docker.compose.file=${DOCKER_COMPOSE_FILE:.docker/docker-compose.yml}
spring.docker.compose.lifecycle-management=${DOCKER_COMPOSE_LIFECYCLE:start-and-stop}
spring.docker.compose.start.command=${DOCKER_COMPOSE_START_COMMAND:up}
spring.docker.compose.stop.command=${DOCKER_COMPOSE_STOP_COMMAND:down}

# Configurazione Security
spring.security.user.name=${SPRING_SECURITY_USER_NAME:test}
spring.security.user.password=${SPRING_SECURITY_USER_PASSWORD:test}

# Configurazione PostgreSQL Master Database (per tabella tenants)
master.datasource.url=${MASTER_DATABASE_URL:jdbc:postgresql://localhost:5432/zenflow_master}
master.datasource.username=${MASTER_DATABASE_USERNAME:postgres}
master.datasource.password=${MASTER_DATABASE_PASSWORD:postgres}
master.datasource.driver-class-name=org.postgresql.Driver

# Configurazione JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}
spring.jpa.properties.hibernate.default_schema=zenflow

# Configurazione tenant di default (nome tenant)
defaultTenant=tenant1

# Configurazione Flyway Multi-tenant
spring.flyway.enabled=false
flyway.locations=classpath:db/migration/tenant
flyway.baseline-on-migrate=true
flyway.default-schema=zenflow

# Configurazione Hibernate Envers per audit
spring.jpa.properties.org.hibernate.envers.audit_table_suffix=${ENVERS_AUDIT_TABLE_SUFFIX:_AUD}
spring.jpa.properties.org.hibernate.envers.revision_field_name=${ENVERS_REVISION_FIELD_NAME:REV}
spring.jpa.properties.org.hibernate.envers.revision_type_field_name=${ENVERS_REVISION_TYPE_FIELD_NAME:REVTYPE}

# Configurazioni aggiuntive per ambiente
server.port=${SERVER_PORT:8080}
logging.level.it.zenflow=${LOGGING_LEVEL_ZENFLOW:INFO}
logging.level.org.springframework.security=${LOGGING_LEVEL_SECURITY:WARN}

# Email Configuration
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}

spring.jpa.open-in-view=false

# HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.auto-commit=true

# Master DataSource HikariCP Settings
master.datasource.hikari.maximum-pool-size=5
master.datasource.hikari.minimum-idle=1
master.datasource.hikari.idle-timeout=30000
master.datasource.hikari.max-lifetime=60000
master.datasource.hikari.connection-timeout=5000
master.datasource.hikari.leak-detection-threshold=60000

# Spring DevTools Configuration
spring.devtools.restart.additional-exclude=META-INF/resources/**,resources/**,static/**,public/**,templates/**
spring.devtools.restart.poll-interval=2s
spring.devtools.restart.quiet-period=1s
