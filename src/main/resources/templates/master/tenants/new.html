<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/master/common :: head(~{::title})}">
    <title>ZenFlow Master - Nuovo Tenant</title>
</head>
<body>
    <!-- Master Navbar -->
    <div th:replace="~{fragments/master/navbar :: navbar}"></div>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Nuovo Tenant</h1>
            <div>
                <a th:href="@{/master/tenants}" class="btn btn-secondary">
                    <i class="bi bi-arrow-left"></i> Torna alla Lista
                </a>
            </div>
        </div>

        <div class="card">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">Crea Nuovo Tenant</h5>
            </div>
            <div class="card-body">
                <form th:action="@{/master/tenants}" method="post" th:object="${tenant}">
                    <div class="mb-3">
                        <label for="name" class="form-label">Nome</label>
                        <input type="text" class="form-control" id="name" th:field="*{name}" required>
                        <div class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                    </div>
                    <div class="mb-3">
                        <label for="url" class="form-label">URL</label>
                        <input type="text" class="form-control" id="url" th:field="*{url}" 
                               placeholder="jdbc:postgresql://localhost:5432/nome_tenant" required>
                        <div class="text-danger" th:if="${#fields.hasErrors('url')}" th:errors="*{url}"></div>
                    </div>
                    <div class="mb-3">
                        <label for="username" class="form-label">Username DB</label>
                        <input type="text" class="form-control" id="username" th:field="*{username}" required>
                        <div class="text-danger" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password DB</label>
                        <input type="password" class="form-control" id="password" th:field="*{password}" required>
                        <div class="text-danger" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                    </div>
                    <div class="mb-3">
                        <label for="driver" class="form-label">Driver</label>
                        <input type="text" class="form-control" id="driver" th:field="*{driver}" 
                               placeholder="org.postgresql.Driver">
                        <div class="text-danger" th:if="${#fields.hasErrors('driver')}" th:errors="*{driver}"></div>
                    </div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="enabled" th:field="*{enabled}">
                        <label class="form-check-label" for="enabled">Abilitato</label>
                    </div>

                    <div class="mb-3">
                        <label for="adminEmail" class="form-label">Email Utente Admin</label>
                        <input type="email" class="form-control" id="adminEmail" th:field="*{adminEmail}" 
                               placeholder="admin@example.com">
                        <div class="form-text">Se specificata, verrà creato un utente admin per questo tenant e inviata un'email con le credenziali.</div>
                        <div class="text-danger" th:if="${#fields.hasErrors('adminEmail')}" th:errors="*{adminEmail}"></div>
                    </div>

                    <button type="submit" class="btn btn-success">Crea Tenant</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <th:block th:replace="~{fragments/master/common :: scripts}"></th:block>
</body>
</html>
