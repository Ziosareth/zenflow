<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZenFlow Master - Dettaglio Tenant</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/master/css/master-style.css}">
</head>
<body>
    <!-- Master Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">ZenFlow Master</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#masterNavbar"
                    aria-controls="masterNavbar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="masterNavbar">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/master/dashboard}">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" th:href="@{/master/tenants}">Gestione Tenant</a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <form th:action="@{/master/logout}" method="post" style="display: inline;">
                            <button type="submit" class="btn btn-outline-light">Logout</button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Dettaglio Tenant</h1>
            <div>
                <a th:href="@{/master/tenants}" class="btn btn-secondary">
                    <i class="bi bi-arrow-left"></i> Torna alla Lista
                </a>
                <a th:href="@{/master/tenants/{name}/edit(name=${tenant.name})}" class="btn btn-warning">
                    <i class="bi bi-pencil"></i> Modifica
                </a>
            </div>
        </div>

        <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${message}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="card">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0" th:text="${tenant.name}">Nome Tenant</h5>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6">
                        <p><strong>Nome:</strong> <span th:text="${tenant.name}"></span></p>
                        <p><strong>URL:</strong> <span th:text="${tenant.url}"></span></p>
                        <p><strong>Username:</strong> <span th:text="${tenant.username}"></span></p>
                        <p><strong>Driver:</strong> <span th:text="${tenant.driver}"></span></p>
                        <p>
                            <strong>Stato:</strong> 
                            <span th:if="${tenant.enabled}" class="badge bg-success">Attivo</span>
                            <span th:unless="${tenant.enabled}" class="badge bg-danger">Disabilitato</span>
                        </p>
                    </div>
                </div>

                <hr>

                <div class="d-flex gap-2">
                    <form th:action="@{/master/tenants/{name}/toggle-status(name=${tenant.name})}" method="post">
                        <button type="submit" class="btn btn-danger" th:if="${tenant.enabled}">
                            <i class="bi bi-x-circle"></i> Disabilita Tenant
                        </button>
                        <button type="submit" class="btn btn-success" th:unless="${tenant.enabled}">
                            <i class="bi bi-check-circle"></i> Abilita Tenant
                        </button>
                    </form>

                    <form th:action="@{/master/tenants/{name}/initialize(name=${tenant.name})}" method="post">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-database-add"></i> Inizializza Database
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Master Flow Animation -->
    <script th:src="@{/master/js/masterFlowAnimation.js}"></script>
</body>
</html>
