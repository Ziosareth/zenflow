<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/master/common :: head(~{::title})}">
    <title>ZenFlow Master - Modifica Tenant</title>
</head>
<body>
    <!-- Master Navbar -->
    <div th:replace="~{fragments/master/navbar :: navbar}"></div>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Modifica Tenant</h1>
            <div>
                <a th:href="@{/master/tenants}" class="btn btn-secondary">
                    <i class="bi bi-arrow-left"></i> Torna alla Lista
                </a>
                <a th:href="@{/master/tenants/{name}(name=${tenantName})}" class="btn btn-primary">
                    <i class="bi bi-eye"></i> Visualizza Dettagli
                </a>
            </div>
        </div>

        <div class="card">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">Modifica Tenant: <span th:text="${tenantName}"></span></h5>
            </div>
            <div class="card-body">
                <form th:action="@{/master/tenants/{name}(name=${tenantName})}" method="post" th:object="${tenant}">
                    <div class="mb-3">
                        <label for="url" class="form-label">URL</label>
                        <input type="text" class="form-control" id="url" th:field="*{url}" required>
                        <div class="text-danger" th:if="${#fields.hasErrors('url')}" th:errors="*{url}"></div>
                    </div>
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" th:field="*{username}" required>
                        <div class="text-danger" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" th:field="*{password}" 
                               placeholder="Lascia vuoto per mantenere la password attuale">
                        <div class="text-danger" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                    </div>
                    <div class="mb-3">
                        <label for="driver" class="form-label">Driver</label>
                        <input type="text" class="form-control" id="driver" th:field="*{driver}" required>
                        <div class="text-danger" th:if="${#fields.hasErrors('driver')}" th:errors="*{driver}"></div>
                    </div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="enabled" th:field="*{enabled}">
                        <label class="form-check-label" for="enabled">Abilitato</label>
                    </div>

                    <button type="submit" class="btn btn-primary">Salva Modifiche</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <th:block th:replace="~{fragments/master/common :: scripts}"></th:block>
</body>
</html>
