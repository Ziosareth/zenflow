<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/master/common :: head(~{::title})}">
    <title>ZenFlow Master - Gestione Tenant</title>
</head>
<body>
    <!-- Master Navbar -->
    <div th:replace="~{fragments/master/navbar :: navbar}"></div>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Gestione Tenant</h1>
            <div>
                <a th:href="@{/master/tenants/new}" class="btn btn-success">
                    <i class="bi bi-plus-circle"></i> Nuovo Tenant
                </a>
            </div>
        </div>

        <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${message}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="card">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">Lista Tenant</h5>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>Nome</th>
                                <th>URL</th>
                                <th>Username</th>
                                <th>Stato</th>
                                <th>Azioni</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="tenant : ${tenants}">
                                <td th:text="${tenant.name}"></td>
                                <td th:text="${tenant.url}"></td>
                                <td th:text="${tenant.username}"></td>
                                <td>
                                    <span th:if="${tenant.enabled}" class="badge bg-success">Attivo</span>
                                    <span th:unless="${tenant.enabled}" class="badge bg-danger">Disabilitato</span>
                                </td>
                                <td>
                                    <div class="btn-group btn-group-sm">
                                        <a th:href="@{/master/tenants/{name}(name=${tenant.name})}"
                                           class="btn btn-outline-primary" title="Visualizza">
                                            <i class="bi bi-eye"></i>
                                        </a>
                                        <a th:href="@{/master/tenants/{name}/edit(name=${tenant.name})}"
                                           class="btn btn-outline-secondary" title="Modifica">
                                            <i class="bi bi-pencil"></i>
                                        </a>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Pagination -->
                <div class="d-flex justify-content-between align-items-center mt-4" th:if="${totalPages > 0}">
                    <div>
                        <span>Visualizzazione di <span th:text="${totalItems}"></span> elementi</span>
                    </div>
                    <nav aria-label="Page navigation">
                        <ul class="pagination">
                            <!-- Previous button -->
                            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                                <a class="page-link" th:href="@{/master/tenants(page=${currentPage - 1}, size=${pageSize}, sort=${sortField})}" aria-label="Previous">
                                    <span aria-hidden="true">&laquo;</span>
                                </a>
                            </li>

                            <!-- Page numbers -->
                            <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" 
                                th:classappend="${currentPage == i} ? 'active'">
                                <a class="page-link" th:href="@{/master/tenants(page=${i}, size=${pageSize}, sort=${sortField})}" 
                                   th:text="${i + 1}"></a>
                            </li>

                            <!-- Next button -->
                            <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                                <a class="page-link" th:href="@{/master/tenants(page=${currentPage + 1}, size=${pageSize}, sort=${sortField})}" aria-label="Next">
                                    <span aria-hidden="true">&raquo;</span>
                                </a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <th:block th:replace="~{fragments/master/common :: scripts}"></th:block>
</body>
</html>
