<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/master/common :: head(~{::title})}">
    <title>ZenFlow Master - Login</title>
</head>
<body class="bg-light">
    <div class="container">
        <div class="row justify-content-center mt-5">
            <div class="col-md-6 col-lg-4">
                <div class="card shadow shadow-lg">
                    <div class="card-header bg-primary text-white text-center">
                        <h4>ZenFlow Master</h4>
                    </div>
                    <div class="card-body">
                        <div th:if="${param.error}" class="alert alert-danger">
                            Credenziali non valide. Riprova.
                        </div>
                        <div th:if="${param.logout}" class="alert alert-success">
                            Logout effettuato con successo.
                        </div>
                        <form th:action="@{/master/login}" method="post">
                            <div class="mb-3">
                                <label for="username" class="form-label">Username</label>
                                <input type="text" class="form-control" id="username" name="username" required autofocus>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" name="password" required>
                            </div>
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary">Accedi</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <th:block th:replace="~{fragments/master/common :: scripts}"></th:block>
</body>
</html>
