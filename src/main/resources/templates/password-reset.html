<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head(~{::title}, ~{})}">
    <title th:text="#{password.reset.title}">Reset Password - ZenFlow</title>
</head>
<body class="bg-light">
    <div class="container">
        <!-- Lang Switcher -->
        <div class="row justify-content-end mt-3">
            <div class="col-auto">
                <div class="dropdown">
                    <button class="btn btn-sm btn-outline-secondary dropdown-toggle" type="button" id="languageDropdown" 
                            data-bs-toggle="dropdown" aria-expanded="false" th:text="#{lang.change}">
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="languageDropdown">
                        <li><a class="dropdown-item" th:href="@{/change-lang(lang='it',referer='/password/reset')}" th:text="#{lang.it}"></a></li>
                        <li><a class="dropdown-item" th:href="@{/change-lang(lang='en',referer='/password/reset')}" th:text="#{lang.en}"></a></li>
                    </ul>
                </div>
            </div>
        </div>

        <div class="row justify-content-center mt-3">
            <div class="col-md-6 col-lg-4">
                <div class="card shadow shadow-lg">
                    <div class="card-header bg-dark text-white text-center">
                        <h4 th:text="#{password.reset.title}">Reset Password</h4>
                    </div>
                    <div class="card-body">
                        <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
                        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                        
                        <form th:action="@{/password/reset}" method="post" th:object="${passwordResetForm}">
                            <input type="hidden" th:field="*{token}">
                            
                            <div class="mb-3">
                                <label for="newPassword" class="form-label" th:text="#{password.new}">New Password</label>
                                <input type="password" class="form-control" id="newPassword" th:field="*{newPassword}" required>
                                <div class="text-danger" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
                            </div>
                            <div class="mb-3">
                                <label for="confirmPassword" class="form-label" th:text="#{password.confirm}">Confirm Password</label>
                                <input type="password" class="form-control" id="confirmPassword" th:field="*{confirmPassword}" required>
                                <div class="text-danger" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                            </div>
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-dark" th:text="#{password.reset.button}">Reset Password</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <th:block th:replace="~{fragments/common :: scripts(~{})}"></th:block>
</body>
</html>
