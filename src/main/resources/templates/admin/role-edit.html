<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head(~{::title}, ~{})}">
    <title th:text="${role.id == null} ? #{admin.roles.new} : #{admin.roles.edit}">Edit Role - ZenFlow</title>
</head>
<body>
    <!-- Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 th:text="${role.id == null} ? #{admin.roles.new} : #{admin.roles.edit}">Edit Role</h1>
            <div>
                <a th:href="@{/admin/roles}" class="btn btn-secondary">
                    <i class="bi bi-arrow-left"></i> <span th:text="#{admin.roles.back}">Back to Roles</span>
                </a>
                <a th:if="${role.id != null}" th:href="@{/admin/roles/{id}(id=${role.id})}" class="btn btn-primary">
                    <i class="bi bi-eye"></i> <span th:text="#{admin.roles.view}">View Details</span>
                </a>
            </div>
        </div>

        <div class="card">
            <div class="card-header bg-dark text-white">
                <h5 class="mb-0" th:text="${role.id == null} ? #{admin.roles.new} : #{admin.roles.edit} + ': ' + ${role.name}">Edit Role</h5>
            </div>
            <div class="card-body">
                <form th:action="@{${role.id == null ? '/admin/roles/new' : '/admin/roles/' + role.id}}" method="post" th:object="${role}">
                    <div class="mb-3">
                        <label for="name" class="form-label" th:text="#{admin.roles.name}">Name</label>
                        <input type="text" class="form-control" id="name" th:field="*{name}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" th:text="#{admin.roles.permissions}">Permissions</label>
                        <div class="accordion" id="permissionsAccordion">
                            <div class="accordion-item" th:each="category : ${permissionsByCategory.keySet()}">
                                <h2 class="accordion-header">
                                    <button class="accordion-button" type="button" data-bs-toggle="collapse" 
                                            th:data-bs-target="${'#category-' + category}" 
                                            th:aria-controls="${'category-' + category}">
                                        <span th:text="${permissionService.getLocalizedCategoryName(category)}">Category Name</span>
                                    </button>
                                </h2>
                                <div th:id="${'category-' + category}" class="accordion-collapse collapse show">
                                    <div class="accordion-body">
                                        <div class="form-check" th:each="permission : ${permissionsByCategory.get(category)}">
                                            <input class="form-check-input" type="checkbox" 
                                                   th:field="*{permissions}" 
                                                   th:value="${permission.id}" 
                                                   th:id="${'permission-' + permission.id}">
                                            <label class="form-check-label" 
                                                   th:for="${'permission-' + permission.id}">
                                                <span th:text="${permission.name}">Permission Name</span>
                                                <small class="text-muted" th:text="${permissionService.getLocalizedDescription(permission)}">Permission Description</small>
                                            </label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary" th:text="#{admin.roles.save}">Save Changes</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Script -->
    <th:block th:replace="~{fragments/common :: scripts(~{})}"></th:block>
</body>
</html>
