<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head(~{::title}, ~{})}">
    <title th:text="#{admin.roles.title}">Role Management - ZenFlow</title>
</head>
<body>
    <!-- Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 th:text="#{admin.roles.title}">Role Management</h1>
            <div>
                <a th:href="@{/admin/roles/new}" class="btn btn-primary">
                    <i class="bi bi-plus-circle"></i> <span th:text="#{admin.roles.new}">New Role</span>
                </a>
            </div>
        </div>

        <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${message}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="card">
            <div class="card-header bg-dark text-white">
                <h5 class="mb-0" th:text="#{admin.roles.list}">Roles</h5>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th th:text="#{admin.roles.id}">ID</th>
                                <th th:text="#{admin.roles.name}">Name</th>
                                <th th:text="#{admin.roles.permissions}">Permissions</th>
                                <th th:text="#{admin.roles.actions}">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="role : ${roles}">
                                <td th:text="${role.id}"></td>
                                <td th:text="${role.name}"></td>
                                <td>
                                    <span th:each="permission, iterStat : ${role.permissions}" class="badge bg-secondary me-1" th:text="${permission.name}"></span>
                                </td>
                                <td>
                                    <div class="btn-group btn-group-sm">
                                        <a th:href="@{/admin/roles/{id}(id=${role.id})}"
                                           class="btn btn-outline-primary" title="View">
                                            <i class="bi bi-eye"></i>
                                        </a>
                                        <a th:href="@{/admin/roles/{id}/edit(id=${role.id})}"
                                           class="btn btn-outline-secondary" title="Edit">
                                            <i class="bi bi-pencil"></i>
                                        </a>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Pagination -->
                <div class="d-flex justify-content-between align-items-center mt-4" th:if="${totalPages > 0}">
                    <div>
                        <span th:text="#{admin.roles.showing} + ' ' + ${totalItems} + ' ' + #{admin.roles.entries}">Showing entries</span>
                    </div>
                    <nav aria-label="Page navigation">
                        <ul class="pagination">
                            <!-- Previous button -->
                            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                                <a class="page-link" th:href="@{/admin/roles(page=${currentPage - 1}, size=${pageSize}, sort=${sortField})}" aria-label="Previous">
                                    <span aria-hidden="true">&laquo;</span>
                                </a>
                            </li>

                            <!-- Page numbers -->
                            <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" 
                                th:classappend="${currentPage == i} ? 'active'">
                                <a class="page-link" th:href="@{/admin/roles(page=${i}, size=${pageSize}, sort=${sortField})}" 
                                   th:text="${i + 1}"></a>
                            </li>

                            <!-- Next button -->
                            <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                                <a class="page-link" th:href="@{/admin/roles(page=${currentPage + 1}, size=${pageSize}, sort=${sortField})}" aria-label="Next">
                                    <span aria-hidden="true">&raquo;</span>
                                </a>
                            </li>
                        </ul>
                    </nav>

                    <!-- Page size selector -->
                    <div class="dropdown">
                        <button class="btn btn-secondary dropdown-toggle" type="button" id="pageSizeDropdown" 
                                data-bs-toggle="dropdown" aria-expanded="false">
                            <span th:text="#{admin.roles.page.size} + ': ' + ${pageSize}">Page Size</span>
                        </button>
                        <ul class="dropdown-menu" aria-labelledby="pageSizeDropdown">
                            <li><a class="dropdown-item" th:href="@{/admin/roles(page=0, size=5, sort=${sortField})}">5</a></li>
                            <li><a class="dropdown-item" th:href="@{/admin/roles(page=0, size=10, sort=${sortField})}">10</a></li>
                            <li><a class="dropdown-item" th:href="@{/admin/roles(page=0, size=20, sort=${sortField})}">20</a></li>
                            <li><a class="dropdown-item" th:href="@{/admin/roles(page=0, size=50, sort=${sortField})}">50</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Script -->
    <th:block th:replace="~{fragments/common :: scripts(~{})}"></th:block>
</body>
</html>
