<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head(~{::title}, ~{})}">
    <title th:text="#{admin.users.edit}">Edit User - ZenFlow</title>
</head>
<body>
    <!-- Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 th:text="#{admin.users.edit}">Edit User</h1>
            <div>
                <a th:href="@{/admin/users}" class="btn btn-secondary">
                    <i class="bi bi-arrow-left"></i> <span th:text="#{admin.users.back}">Back to Users</span>
                </a>
                <a th:href="@{/admin/users/{id}(id=${user.id})}" class="btn btn-primary">
                    <i class="bi bi-eye"></i> <span th:text="#{admin.users.view}">View Details</span>
                </a>
            </div>
        </div>

        <div class="card">
            <div class="card-header bg-dark text-white">
                <h5 class="mb-0"><span th:text="#{admin.users.edit}">Edit User</span>: <span th:text="${user.username}"></span></h5>
            </div>
            <div class="card-body">
                <form th:action="@{/admin/users/{id}(id=${user.id})}" method="post" th:object="${user}">
                    <div class="mb-3">
                        <label for="username" class="form-label" th:text="#{login.username}">Username</label>
                        <input type="text" class="form-control" id="username" th:field="*{username}" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label" th:text="#{admin.users.email}">Email</label>
                        <input type="email" class="form-control" id="email" th:field="*{email}" required>
                    </div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="enabled" th:field="*{enabled}">
                        <label class="form-check-label" for="enabled" th:text="#{admin.users.status.active}">Enabled</label>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" th:text="#{admin.users.roles}">Roles</label>
                        <div class="card">
                            <div class="card-body">
                                <div class="form-check" th:each="role : ${allRoles}">
                                    <input class="form-check-input" type="checkbox" 
                                           th:field="*{roles}" 
                                           th:value="${role.id}" 
                                           th:id="${'role-' + role.id}">
                                    <label class="form-check-label" 
                                           th:for="${'role-' + role.id}" 
                                           th:text="${role.name}">Role Name</label>
                                </div>
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary" th:text="#{admin.users.save}">Save Changes</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Script -->
    <th:block th:replace="~{fragments/common :: scripts(~{})}"></th:block>
</body>
</html>
