<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head(~{::title}, ~{})}">
    <title th:text="#{admin.roles.detail}">Role Details - ZenFlow</title>
</head>
<body>
    <!-- Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 th:text="#{admin.roles.detail}">Role Details</h1>
            <div>
                <a th:href="@{/admin/roles}" class="btn btn-secondary">
                    <i class="bi bi-arrow-left"></i> <span th:text="#{admin.roles.back}">Back to Roles</span>
                </a>
                <a th:href="@{/admin/roles/{id}/edit(id=${role.id})}" class="btn btn-warning">
                    <i class="bi bi-pencil"></i> <span th:text="#{admin.roles.edit}">Edit</span>
                </a>
            </div>
        </div>

        <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${message}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="card">
            <div class="card-header bg-dark text-white">
                <h5 class="mb-0" th:text="${role.name}">Role Name</h5>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6">
                        <p><strong th:text="#{admin.roles.id} + ':'">ID:</strong> <span th:text="${role.id}"></span></p>
                        <p><strong th:text="#{admin.roles.name} + ':'">Name:</strong> <span th:text="${role.name}"></span></p>
                    </div>
                    <div class="col-md-6">
                        <p><strong th:text="#{admin.roles.permissions} + ':'">Permissions:</strong></p>
                        <div th:if="${#lists.isEmpty(role.permissions)}" class="text-muted" th:text="#{admin.roles.no.permissions}">No permissions assigned</div>
                        <div th:if="${!#lists.isEmpty(role.permissions)}">
                            <!-- Display permissions grouped by category -->
                            <div class="mb-3" th:each="category : ${rolePermissionsByCategory.keySet()}">
                                <h6 th:text="${permissionService.getLocalizedCategoryName(category)}">Category Name</h6>
                                <div>
                                    <span th:each="permission : ${rolePermissionsByCategory.get(category)}" 
                                          class="badge bg-secondary me-1 mb-1" 
                                          th:text="${permission.name}"
                                          th:title="${permissionService.getLocalizedDescription(permission)}">
                                        Permission Name
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <hr>

                <form th:action="@{/admin/roles/{id}/delete(id=${role.id})}" method="post" class="mt-3" th:attr="onsubmit=|return confirm('${#messages.msg('admin.roles.delete.confirm')}')|">
                    <button type="submit" class="btn btn-danger">
                        <i class="bi bi-trash"></i> <span th:text="#{admin.roles.delete}">Delete Role</span>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Script -->
    <th:block th:replace="~{fragments/common :: scripts(~{})}"></th:block>
</body>
</html>
