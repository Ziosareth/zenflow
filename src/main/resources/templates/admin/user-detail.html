<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head(~{::title}, ~{})}">
    <title th:text="#{admin.users.detail}">User Details - ZenFlow</title>
</head>
<body>
    <!-- Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 th:text="#{admin.users.detail}">User Details</h1>
            <div>
                <a th:href="@{/admin/users}" class="btn btn-secondary">
                    <i class="bi bi-arrow-left"></i> <span th:text="#{admin.users.back}">Back to Users</span>
                </a>
                <a th:href="@{/admin/users/{id}/edit(id=${user.id})}" class="btn btn-warning">
                    <i class="bi bi-pencil"></i> <span th:text="#{admin.users.edit}">Edit</span>
                </a>
            </div>
        </div>

        <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${message}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="card">
            <div class="card-header bg-dark text-white">
                <h5 class="mb-0" th:text="${user.username}">Username</h5>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6">
                        <p><strong>ID:</strong> <span th:text="${user.id}"></span></p>
                        <p><strong>Username:</strong> <span th:text="${user.username}"></span></p>
                        <p><strong>Email:</strong> <span th:text="${user.email}"></span></p>
                        <p>
                            <strong>Status:</strong> 
                            <span th:if="${user.enabled}" class="badge bg-success" th:text="#{admin.users.status.active}">Active</span>
                            <span th:unless="${user.enabled}" class="badge bg-danger" th:text="#{admin.users.status.disabled}">Disabled</span>
                        </p>
                    </div>
                    <div class="col-md-6">
                        <p><strong>Roles:</strong></p>
                        <ul>
                            <li th:each="role : ${user.roles}" th:text="${role.name}"></li>
                        </ul>
                    </div>
                </div>

                <hr>

                <form th:action="@{/admin/users/{id}/toggle-status(id=${user.id})}" method="post" class="mt-3">
                    <button type="submit" class="btn btn-danger" th:if="${user.enabled}">
                        <i class="bi bi-x-circle"></i> <span th:text="#{admin.users.disable}">Disable User</span>
                    </button>
                    <button type="submit" class="btn btn-success" th:unless="${user.enabled}">
                        <i class="bi bi-check-circle"></i> <span th:text="#{admin.users.enable}">Enable User</span>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Script -->
    <th:block th:replace="~{fragments/common :: scripts(~{})}"></th:block>
</body>
</html>
