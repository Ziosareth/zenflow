<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head(~{::title}, ~{})}">
    <title th:text="#{admin.users.title}">User Management - ZenFlow</title>
</head>
<body>
    <!-- Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 th:text="#{admin.users.title}">User Management</h1>
        </div>

        <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${message}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="card">
            <div class="card-header bg-dark text-white">
                <h5 class="mb-0" th:text="#{admin.users.list}">Users</h5>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th th:text="#{admin.users.id}">ID</th>
                                <th th:text="#{admin.users.username}">Username</th>
                                <th th:text="#{admin.users.email}">Email</th>
                                <th th:text="#{admin.users.status}">Status</th>
                                <th th:text="#{admin.users.roles}">Roles</th>
                                <th th:text="#{admin.users.actions}">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="user : ${users}">
                                <td th:text="${user.id}"></td>
                                <td th:text="${user.username}"></td>
                                <td th:text="${user.email}"></td>
                                <td>
                                    <span th:if="${user.enabled}" class="badge bg-success" th:text="#{admin.users.status.active}">Active</span>
                                    <span th:unless="${user.enabled}" class="badge bg-danger" th:text="#{admin.users.status.disabled}">Disabled</span>
                                </td>
                                <td>
                                    <span th:each="role, iterStat : ${user.roles}" class="badge bg-secondary me-1" th:text="${role.name}"></span>
                                </td>
                                <td>
                                    <a th:href="@{/admin/users/{id}(id=${user.id})}" class="btn btn-sm btn-primary">
                                        <i class="bi bi-eye"></i> <span th:text="#{admin.users.view}">View</span>
                                    </a>
                                    <a th:href="@{/admin/users/{id}/edit(id=${user.id})}" class="btn btn-sm btn-warning">
                                        <i class="bi bi-pencil"></i> <span th:text="#{admin.users.edit}">Edit</span>
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Pagination -->
                <div class="d-flex justify-content-between align-items-center mt-4" th:if="${totalPages > 0}">
                    <div>
                        <span th:text="#{admin.users.showing} + ' ' + ${totalItems} + ' ' + #{admin.users.entries}">Showing entries</span>
                    </div>
                    <nav aria-label="Page navigation">
                        <ul class="pagination">
                            <!-- Previous button -->
                            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                                <a class="page-link" th:href="@{/admin/users(page=${currentPage - 1}, size=${pageSize}, sort=${sortField})}" aria-label="Previous">
                                    <span aria-hidden="true">&laquo;</span>
                                </a>
                            </li>

                            <!-- Page numbers -->
                            <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" 
                                th:classappend="${currentPage == i} ? 'active'">
                                <a class="page-link" th:href="@{/admin/users(page=${i}, size=${pageSize}, sort=${sortField})}" 
                                   th:text="${i + 1}"></a>
                            </li>

                            <!-- Next button -->
                            <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                                <a class="page-link" th:href="@{/admin/users(page=${currentPage + 1}, size=${pageSize}, sort=${sortField})}" aria-label="Next">
                                    <span aria-hidden="true">&raquo;</span>
                                </a>
                            </li>
                        </ul>
                    </nav>

                    <!-- Page size selector -->
                    <div class="dropdown">
                        <button class="btn btn-secondary dropdown-toggle" type="button" id="pageSizeDropdown" 
                                data-bs-toggle="dropdown" aria-expanded="false">
                            <span th:text="#{admin.users.page.size} + ': ' + ${pageSize}">Page Size</span>
                        </button>
                        <ul class="dropdown-menu" aria-labelledby="pageSizeDropdown">
                            <li><a class="dropdown-item" th:href="@{/admin/users(page=0, size=5, sort=${sortField})}">5</a></li>
                            <li><a class="dropdown-item" th:href="@{/admin/users(page=0, size=10, sort=${sortField})}">10</a></li>
                            <li><a class="dropdown-item" th:href="@{/admin/users(page=0, size=20, sort=${sortField})}">20</a></li>
                            <li><a class="dropdown-item" th:href="@{/admin/users(page=0, size=50, sort=${sortField})}">50</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Script -->
    <th:block th:replace="~{fragments/common :: scripts(~{})}"></th:block>
</body>
</html>
