<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head(~{::title}, ~{})}">
    <title th:text="#{admin.users.title}">User Management - ZenFlow</title>
</head>
<body>
    <!-- Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 th:text="#{admin.users.title}">User Management</h1>
        </div>

        <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${message}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="card">
            <div class="card-header bg-dark text-white">
                <h5 class="mb-0" th:text="#{admin.users.list}">Users</h5>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Username</th>
                                <th>Email</th>
                                <th>Status</th>
                                <th>Roles</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="user : ${users}">
                                <td th:text="${user.id}"></td>
                                <td th:text="${user.username}"></td>
                                <td th:text="${user.email}"></td>
                                <td>
                                    <span th:if="${user.enabled}" class="badge bg-success" th:text="#{admin.users.status.active}">Active</span>
                                    <span th:unless="${user.enabled}" class="badge bg-danger" th:text="#{admin.users.status.disabled}">Disabled</span>
                                </td>
                                <td>
                                    <span th:each="role, iterStat : ${user.roles}" class="badge bg-secondary me-1" th:text="${role.name}"></span>
                                </td>
                                <td>
                                    <a th:href="@{/admin/users/{id}(id=${user.id})}" class="btn btn-sm btn-primary">
                                        <i class="bi bi-eye"></i> <span th:text="#{admin.users.view}">View</span>
                                    </a>
                                    <a th:href="@{/admin/users/{id}/edit(id=${user.id})}" class="btn btn-sm btn-warning">
                                        <i class="bi bi-pencil"></i> <span th:text="#{admin.users.edit}">Edit</span>
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Script -->
    <th:block th:replace="~{fragments/common :: scripts(~{})}"></th:block>
</body>
</html>
