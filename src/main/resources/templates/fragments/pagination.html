<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <!-- Pagination fragment -->
    <div th:fragment="pagination(baseUrl, currentPage, totalPages, totalItems, pageSize, sortField)" 
         class="d-flex justify-content-between align-items-center mt-4" 
         th:if="${totalPages > 0}">
        
        <!-- Entry count display -->
        <div>
            <span th:text="#{project.showing} + ' ' + ${totalItems} + ' ' + #{project.entries}">Showing entries</span>
        </div>
        
        <!-- Page navigation -->
        <nav aria-label="Page navigation">
            <ul class="pagination">
                <!-- Previous button -->
                <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                    <a class="page-link" th:href="@{${baseUrl}(page=${currentPage - 1}, size=${pageSize}, sort=${sortField})}" aria-label="Previous">
                        <span aria-hidden="true">&laquo;</span>
                    </a>
                </li>

                <!-- Page numbers -->
                <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" 
                    th:classappend="${currentPage == i} ? 'active'">
                    <a class="page-link" th:href="@{${baseUrl}(page=${i}, size=${pageSize}, sort=${sortField})}" 
                       th:text="${i + 1}"></a>
                </li>

                <!-- Next button -->
                <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                    <a class="page-link" th:href="@{${baseUrl}(page=${currentPage + 1}, size=${pageSize}, sort=${sortField})}" aria-label="Next">
                        <span aria-hidden="true">&raquo;</span>
                    </a>
                </li>
            </ul>
        </nav>

        <!-- Page size selector -->
        <div class="dropdown">
            <button class="btn btn-secondary dropdown-toggle" type="button" id="pageSizeDropdown" 
                    data-bs-toggle="dropdown" aria-expanded="false">
                <span th:text="#{project.page.size} + ': ' + ${pageSize}">Page Size</span>
            </button>
            <ul class="dropdown-menu" aria-labelledby="pageSizeDropdown">
                <li><a class="dropdown-item" th:href="@{${baseUrl}(page=0, size=5, sort=${sortField})}">5</a></li>
                <li><a class="dropdown-item" th:href="@{${baseUrl}(page=0, size=10, sort=${sortField})}">10</a></li>
                <li><a class="dropdown-item" th:href="@{${baseUrl}(page=0, size=20, sort=${sortField})}">20</a></li>
                <li><a class="dropdown-item" th:href="@{${baseUrl}(page=0, size=50, sort=${sortField})}">50</a></li>
            </ul>
        </div>
    </div>
</body>
</html>
