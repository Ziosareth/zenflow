<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <title>Navbar</title>
</head>
<body>
<div th:fragment="navbar">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="#" th:text="#{app.name}">ZenFlow</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent"
              aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link active" th:href="@{/dashboard}" th:text="#{navbar.dashboard}"></a>
          </li>
          <!-- Projects dropdown menu -->
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" id="projectsDropdown" role="button" 
               data-bs-toggle="dropdown" aria-expanded="false" th:text="#{navbar.projects}">
            </a>
            <ul class="dropdown-menu" aria-labelledby="projectsDropdown">
              <li><a class="dropdown-item" th:href="@{/projects}" th:utext="#{navbar.projects.list}"></a></li>
              <li><a class="dropdown-item" th:href="@{/projects/new}" th:utext="#{navbar.projects.new}"></a></li>
              <li><a class="dropdown-item" th:href="@{/projects/backlog}" th:utext="#{navbar.projects.backlog}"></a></li>
              <li><a class="dropdown-item" th:href="@{/projects/sprint}" th:utext="#{navbar.projects.sprint}"></a></li>
            </ul>
          </li>
          <li class="nav-item">
            <a class="nav-link" th:href="@{/profile}" th:text="#{navbar.profile}"></a>
          </li>
          <li class="nav-item">
            <a class="nav-link" th:href="@{/settings}" th:text="#{navbar.settings}"></a>
          </li>
          <!-- Admin dropdown menu -->
          <li class="nav-item dropdown" sec:authorize="hasAnyRole('ADMIN', 'TECHLEAD')">
            <a class="nav-link dropdown-toggle" href="#" id="adminDropdown" role="button" 
               data-bs-toggle="dropdown" aria-expanded="false" th:text="#{navbar.admin}">

            </a>
            <ul class="dropdown-menu" aria-labelledby="adminDropdown">
              <li><a class="dropdown-item" th:href="@{/admin/users}" th:utext="#{navbar.admin.users}"></a></li>
              <li><a class="dropdown-item" th:href="@{/admin/organization}" th:utext="#{navbar.admin.organization}"></a></li>
              <li><a class="dropdown-item" th:href="@{/admin/integrations}" th:utext="#{navbar.admin.integrations}"></a></li>
              <li><a class="dropdown-item" th:href="@{/admin/templates}" th:utext="#{navbar.admin.templates}"></a></li>
            </ul>
          </li>
        </ul>
        <ul class="navbar-nav me-2">
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" id="languageDropdown" role="button" 
               data-bs-toggle="dropdown" aria-expanded="false" th:text="#{lang.change}">
            </a>
            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="languageDropdown">
              <li><a class="dropdown-item" th:href="@{/change-lang(lang='it')}" th:text="#{lang.it}"></a></li>
              <li><a class="dropdown-item" th:href="@{/change-lang(lang='en')}" th:text="#{lang.en}"></a></li>
            </ul>
          </li>
        </ul>
        <ul class="navbar-nav">
          <li class="nav-item">
            <form th:action="@{/logout}" method="post" style="display: inline;">
              <button type="submit" class="btn btn-outline-light" th:text="#{navbar.logout}"></button>
            </form>
          </li>
        </ul>
      </div>
    </div>
  </nav>
</div>
</body>
</html>
