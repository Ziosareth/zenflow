<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
>
<head th:replace="~{fragments/common :: head(~{::title}, ~{})}">
    <title th:text="${isNew} ? #{milestone.new.title} : #{milestone.edit.title}">Milestone</title>
</head>
<body>
    <!-- Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3 mb-0" th:text="${isNew} ? #{milestone.new.h1} : #{milestone.edit.h1}">New Milestone</h1>
            <div>
                <a th:href="@{/projects/{id}(id=${project.id})}" class="btn btn-secondary">
                    <i class="bi bi-arrow-left"></i> <span th:text="#{project.back}">Back</span>
                </a>
            </div>
        </div>

        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/projects}" th:text="#{project.list}">Projects</a></li>
                <li class="breadcrumb-item"><a th:href="@{/projects/{id}(id=${project.id})}" th:text="${project.name}">Project Name</a></li>
                <li class="breadcrumb-item active" aria-current="page" th:text="${isNew} ? #{milestone.new.title} : #{milestone.edit.title}">Milestone</li>
            </ol>
        </nav>

        <div class="card">
            <div class="card-body">
                <form th:action="@{/projects/{projectId}/milestones/new(projectId=${project.id})}"
                      th:object="${milestoneDTO}" method="post">

                    <input type="hidden" th:field="*{projectId}" />

                    <div class="mb-3">
                        <label class="form-label" for="name" th:text="#{milestone.name}">Name</label>
                        <input id="name" type="text" class="form-control" th:field="*{name}" required maxlength="200">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="description" th:text="#{milestone.description}">Description</label>
                        <textarea id="description" class="form-control" rows="4" th:field="*{description}" maxlength="4000"></textarea>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label" for="targetDate" th:text="#{milestone.targetDate}">Target Date</label>
                            <input id="targetDate" type="date" class="form-control" th:field="*{targetDate}" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('targetDate')}" th:errors="*{targetDate}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="status" th:text="#{milestone.status}">Status</label>
                            <select id="status" class="form-select" th:field="*{status}">
                                <option th:each="st : ${statuses}" th:value="${st}" th:text="${st}"></option>
                            </select>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-save"></i> <span th:text="#{button.save}">Save</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Script -->
    <th:block th:replace="~{fragments/common :: scripts(~{})}"></th:block>
</body>
</html>
