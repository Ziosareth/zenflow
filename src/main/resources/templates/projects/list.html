<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/common :: head(~{::title}, ~{})}">
    <title th:text="${isMyProjects} ? #{project.my.title} : #{project.list.title}">Projects - ZenFlow</title>
</head>
<body>
    <!-- Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 th:text="${isMyProjects} ? #{project.my.title} : #{project.list.title}">Projects</h1>
            <div>
                <a th:href="@{/projects/my}" class="btn btn-outline-primary me-2" th:unless="${isMyProjects}">
                    <i class="bi bi-person-check"></i> <span th:text="#{project.my}">My Projects</span>
                </a>
                <a th:href="@{/projects}" class="btn btn-outline-primary me-2" th:if="${isMyProjects}">
                    <i class="bi bi-list-check"></i> <span th:text="#{project.all}">All Projects</span>
                </a>
                <a sec:authorize="hasAuthority('CREATE_PROJECT')" th:href="@{/projects/new}" class="btn btn-success">
                    <i class="bi bi-plus-circle"></i> <span th:text="#{project.new}">New Project</span>
                </a>
            </div>
        </div>

        <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${message}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="card">
            <div class="card-header bg-dark text-white">
                <h5 class="mb-0" th:text="${isMyProjects} ? #{project.my.list} : #{project.list}">Projects</h5>
            </div>
            <div class="card-body">
                <div th:if="${#lists.isEmpty(projects)}" class="alert alert-info">
                    <span th:text="#{project.no.projects}">No projects found</span>
                </div>
                <div th:unless="${#lists.isEmpty(projects)}" class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th th:text="#{project.id}">ID</th>
                                <th th:text="#{project.name}">Name</th>
                                <th th:text="#{project.type}">Type</th>
                                <th th:text="#{project.status}">Status</th>
                                <th th:text="#{project.owner}">Owner</th>
                                <th th:text="#{project.team}">Team</th>
                                <th th:text="#{project.actions}">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="project : ${projects}">
                                <td th:text="${project.id}"></td>
                                <td th:text="${project.name}"></td>
                                <td>
                                    <span class="badge bg-info" th:text="${project.type != null ? project.type : '-'}">Type</span>
                                </td>
                                <td>
                                    <span th:if="${project.status == null}" class="badge bg-secondary">-</span>
                                    <span th:if="${project.status != null && project.status.name() == 'ACTIVE'}" class="badge bg-success" th:text="${project.status}">Active</span>
                                    <span th:if="${project.status != null && project.status.name() == 'COMPLETED'}" class="badge bg-secondary" th:text="${project.status}">Completed</span>
                                    <span th:if="${project.status != null && project.status.name() == 'ARCHIVED'}" class="badge bg-dark" th:text="${project.status}">Archived</span>
                                    <span th:if="${project.status != null && project.status.name() == 'ON_HOLD'}" class="badge bg-warning" th:text="${project.status}">On Hold</span>
                                </td>
                                <td th:text="${project.owner != null ? project.owner.username : '-'}"></td>
                                <td th:text="${project.teamMembers != null ? project.teamMembers.size() : '0'}"></td>
                                <td>
                                    <div class="btn-group btn-group-sm">
                                        <a th:href="@{/projects/{id}(id=${project.id})}"
                                           class="btn btn-outline-primary" title="View">
                                            <i class="bi bi-eye"></i>
                                        </a>
                                        <a sec:authorize="hasAuthority('UPDATE_PROJECT')" 
                                           th:if="${project.owner != null && currentUser.id == project.owner.id}"
                                           th:href="@{/projects/{id}/edit(id=${project.id})}"
                                           class="btn btn-outline-secondary" title="Edit">
                                            <i class="bi bi-pencil"></i>
                                        </a>
                                        <a sec:authorize="hasAuthority('UPDATE_PROJECT') and hasAuthority('ADMIN')" 
                                           th:unless="${project.owner != null && currentUser.id == project.owner.id}"
                                           th:href="@{/projects/{id}/edit(id=${project.id})}"
                                           class="btn btn-outline-secondary" title="Edit">
                                            <i class="bi bi-pencil"></i>
                                        </a>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Pagination -->
                <div th:replace="~{fragments/pagination :: pagination('/projects', ${currentPage}, ${totalPages}, ${totalItems}, ${pageSize}, ${sortField})}" 
                     th:if="${totalPages > 0 and isMyProjects != true}">
                </div>
            </div>
        </div>
    </div>

    <!-- Script -->
    <th:block th:replace="~{fragments/common :: scripts(~{})}"></th:block>
</body>
</html>
