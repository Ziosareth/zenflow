<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/common :: head(~{::title}, ~{})}">
    <title th:text="${isNew} ? #{project.new.title} : #{project.edit.title}">Project Form - ZenFlow</title>
</head>
<body>
    <!-- Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 th:text="${isNew} ? #{project.new.title} : #{project.edit.title}">Project Form</h1>
            <div>
                <a th:href="@{/projects}" class="btn btn-secondary">
                    <i class="bi bi-arrow-left"></i> <span th:text="#{project.back}">Back to Projects</span>
                </a>
                <a th:if="${!isNew}" th:href="@{/projects/{id}(id=${projectDTO.id})}" class="btn btn-primary ms-2">
                    <i class="bi bi-eye"></i> <span th:text="#{project.view}">View Project</span>
                </a>
            </div>
        </div>

        <div class="card">
            <div class="card-header bg-dark text-white">
                <h5 class="mb-0" th:text="${isNew} ? #{project.new.form} : #{project.edit.form}">Project Form</h5>
            </div>
            <div class="card-body">
                <form th:action="${isNew} ? @{/projects/new} : @{/projects/{id}/edit(id=${projectDTO.id})}" 
                      method="post" 
                      th:object="${projectDTO}">
                    
                    <!-- Hidden ID field for edit mode -->
                    <input type="hidden" th:field="*{id}" th:if="${!isNew}">
                    
                    <!-- Name -->
                    <div class="mb-3">
                        <label for="name" class="form-label" th:text="#{project.name}">Name</label>
                        <input type="text" class="form-control" id="name" th:field="*{name}" required>
                        <div class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                    </div>
                    
                    <!-- Description -->
                    <div class="mb-3">
                        <label for="description" class="form-label" th:text="#{project.description}">Description</label>
                        <textarea class="form-control" id="description" th:field="*{description}" rows="3"></textarea>
                        <div class="text-danger" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
                    </div>
                    
                    <!-- Type -->
                    <div class="mb-3">
                        <label for="type" class="form-label" th:text="#{project.type}">Type</label>
                        <select class="form-select" id="type" th:field="*{type}" required>
                            <option th:each="typeOption : ${types}" 
                                    th:value="${typeOption}" 
                                    th:text="${typeOption}">SCRUM</option>
                        </select>
                        <div class="text-danger" th:if="${#fields.hasErrors('type')}" th:errors="*{type}"></div>
                    </div>
                    
                    <!-- Status -->
                    <div class="mb-3">
                        <label for="status" class="form-label" th:text="#{project.status}">Status</label>
                        <select class="form-select" id="status" th:field="*{status}" required>
                            <option th:each="statusOption : ${statuses}" 
                                    th:value="${statusOption}" 
                                    th:text="${statusOption}">ACTIVE</option>
                        </select>
                        <div class="text-danger" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></div>
                    </div>
                    
                    <!-- Dates -->
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="startDate" class="form-label" th:text="#{project.startDate}">Start Date</label>
                            <input type="date" class="form-control" id="startDate" th:field="*{startDate}">
                            <div class="text-danger" th:if="${#fields.hasErrors('startDate')}" th:errors="*{startDate}"></div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="endDate" class="form-label" th:text="#{project.endDate}">End Date</label>
                            <input type="date" class="form-control" id="endDate" th:field="*{endDate}">
                            <div class="text-danger" th:if="${#fields.hasErrors('endDate')}" th:errors="*{endDate}"></div>
                        </div>
                    </div>
                    
                    <!-- Team Members -->
                    <div class="mb-3">
                        <label class="form-label" th:text="#{project.team.members}">Team Members</label>
                        <div class="card">
                            <div class="card-body">
                                <div class="row">
                                    <div class="col-md-6" th:each="user : ${allUsers}">
                                        <div class="form-check mb-2">
                                            <input class="form-check-input" type="checkbox" 
                                                   th:field="*{teamMemberIds}" 
                                                   th:value="${user.id}" 
                                                   th:id="${'user-' + user.id}">
                                            <label class="form-check-label" 
                                                   th:for="${'user-' + user.id}">
                                                <span th:text="${user.username}">Username</span>
                                                <small class="text-muted ms-1" th:text="'(' + ${user.email} + ')'">user@example.com</small>
                                            </label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Submit Button -->
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-save"></i> <span th:text="${isNew} ? #{project.create} : #{project.save}">Save</span>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Script -->
    <th:block th:replace="~{fragments/common :: scripts(~{})}"></th:block>
</body>
</html>
