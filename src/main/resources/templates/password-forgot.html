<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head(~{::title}, ~{})}">
    <title th:text="#{password.forgot.title}">Forgot Password - ZenFlow</title>
</head>
<body class="bg-light">
    <div class="container">
        <!-- Lang Switcher -->
        <div class="row justify-content-end mt-3">
            <div class="col-auto">
                <div class="dropdown">
                    <button class="btn btn-sm btn-outline-secondary dropdown-toggle" type="button" id="languageDropdown" 
                            data-bs-toggle="dropdown" aria-expanded="false" th:text="#{lang.change}">
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="languageDropdown">
                        <li><a class="dropdown-item" th:href="@{/change-lang(lang='it',referer='/password/forgot')}" th:text="#{lang.it}"></a></li>
                        <li><a class="dropdown-item" th:href="@{/change-lang(lang='en',referer='/password/forgot')}" th:text="#{lang.en}"></a></li>
                    </ul>
                </div>
            </div>
        </div>

        <div class="row justify-content-center mt-3">
            <div class="col-md-6 col-lg-4">
                <div class="card shadow shadow-lg">
                    <div class="card-header bg-dark text-white text-center">
                        <h4 th:text="#{password.forgot.title}">Forgot Password</h4>
                    </div>
                    <div class="card-body">
                        <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
                        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                        
                        <p class="mb-3" th:text="#{password.forgot.instructions}">Enter your email address and we'll send you a link to reset your password.</p>
                        
                        <form th:action="@{/password/forgot}" method="post" th:object="${passwordResetRequestForm}">
                            <div class="mb-3">
                                <label for="email" class="form-label" th:text="#{admin.users.email}">Email</label>
                                <input type="email" class="form-control" id="email" th:field="*{email}" required>
                                <div class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                            </div>
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-dark" th:text="#{password.forgot.button}">Send Reset Link</button>
                            </div>
                        </form>
                        
                        <div class="mt-3 text-center">
                            <a th:href="@{/login}" th:text="#{password.forgot.back.to.login}">Back to Login</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <th:block th:replace="~{fragments/common :: scripts(~{})}"></th:block>
</body>
</html>
