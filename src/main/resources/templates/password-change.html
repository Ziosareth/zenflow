<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head(~{::title}, ~{})}">
    <title th:text="#{password.change.title}">Change Password - ZenFlow</title>
</head>
<body>
    <!-- Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-dark text-white">
                        <h5 class="mb-0" th:text="#{password.change.title}">Change Password</h5>
                    </div>
                    <div class="card-body">
                        <div class="alert alert-info" th:text="#{password.change.required}">
                            You need to change your password before continuing.
                        </div>
                        
                        <form th:action="@{/password/change}" method="post" th:object="${passwordChangeForm}">
                            <div class="mb-3">
                                <label for="newPassword" class="form-label" th:text="#{password.new}">New Password</label>
                                <input type="password" class="form-control" id="newPassword" th:field="*{newPassword}" required>
                                <div class="text-danger" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
                            </div>
                            <div class="mb-3">
                                <label for="confirmPassword" class="form-label" th:text="#{password.confirm}">Confirm Password</label>
                                <input type="password" class="form-control" id="confirmPassword" th:field="*{confirmPassword}" required>
                                <div class="text-danger" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                            </div>
                            <button type="submit" class="btn btn-primary" th:text="#{password.change.button}">Change Password</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Script -->
    <th:block th:replace="~{fragments/common :: scripts(~{})}"></th:block>
</body>
</html>
