<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head(~{::title}, ~{})}">
    <title th:text="#{password.reset.error.title}">Reset Password Error - ZenFlow</title>
</head>
<body class="bg-light">
    <div class="container">
        <!-- Lang Switcher -->
        <div class="row justify-content-end mt-3">
            <div class="col-auto">
                <div class="dropdown">
                    <button class="btn btn-sm btn-outline-secondary dropdown-toggle" type="button" id="languageDropdown" 
                            data-bs-toggle="dropdown" aria-expanded="false" th:text="#{lang.change}">
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="languageDropdown">
                        <li><a class="dropdown-item" th:href="@{/change-lang(lang='it',referer='/password/reset-error')}" th:text="#{lang.it}"></a></li>
                        <li><a class="dropdown-item" th:href="@{/change-lang(lang='en',referer='/password/reset-error')}" th:text="#{lang.en}"></a></li>
                    </ul>
                </div>
            </div>
        </div>

        <div class="row justify-content-center mt-3">
            <div class="col-md-6 col-lg-4">
                <div class="card shadow shadow-lg">
                    <div class="card-header bg-dark text-white text-center">
                        <h4 th:text="#{password.reset.error.title}">Reset Password Error</h4>
                    </div>
                    <div class="card-body">
                        <div class="alert alert-danger" th:text="${error}">Invalid or expired token.</div>
                        
                        <p class="mb-3" th:text="#{password.reset.error.instructions}">The password reset link is invalid or has expired. Please request a new password reset link.</p>
                        
                        <div class="d-grid gap-2">
                            <a th:href="@{/password/forgot}" class="btn btn-dark" th:text="#{password.reset.error.request.new}">Request New Reset Link</a>
                        </div>
                        
                        <div class="mt-3 text-center">
                            <a th:href="@{/login}" th:text="#{password.forgot.back.to.login}">Back to Login</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <th:block th:replace="~{fragments/common :: scripts(~{})}"></th:block>
</body>
</html>
